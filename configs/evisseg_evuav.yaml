STRUCTURE:
  model_name: evissgnet
  width: 12
  block_residual: True
  block_reps: 2
  use_coords: True

GRID_MAMBA:
  # GridMambaNet 基础结构
  input_dim: 3
  embed_dim: 128
  num_classes: 1
  sensor_size: [260, 346]   # [height, width]，与模型内部顺序一致

  # Window / ablation 开关
  use_window: True
  window_size: 400.0
  use_grid_pos_encoding: True
  use_spatial_window_context: True

  # TSGraphEmbedding
  tau_t: 50
  spatial_grid_size: 5
  time_bin_size: 10.0
  use_global_density: True
  use_ts_embedding: True
  use_streaming_ts_embedding: True
  ts_stream_norm_min_count: 256
  ts_stream_norm_eps: 0.000001

  # 多尺度 3D grid: [x_stride, y_stride, t_stride]
  scale_strides:
    - [32.0, 32.0, 100.0]
    - [64.0, 64.0, 200.0]
    - [128.0, 128.0, 400.0]

  # LocalMambaBlock
  d_state: 16
  d_conv: 4
  expand: 2
  dropout: 0.1
  max_seq_len: 1024
  small_bucket_bs: 128
  mid_bucket_bs: 64
  large_bucket_bs: 16
  use_local_mamba_checkpoint: True
  local_mamba_checkpoint_levels: [0]
  local_mamba_checkpoint_policy: adaptive
  local_mamba_checkpoint_min_window_points: 20000

  # SpatialWindowContext
  spatial_context_stride: 8.0
  spatial_context_use_conv: True
  spatial_context_d_state: 16
  spatial_context_d_conv: 4
  spatial_context_expand: 1
  spatial_context_dropout: 0.1
  spatial_context_alpha_init: 0.1
  spatial_pool_use_score: True
  use_stream_mamba_checkpoint: False
  use_temporal_cell_diffusion: True
  temporal_cell_diffusion_kernel_size: 3
  temporal_cell_diffusion_source: prev_context
  temporal_context_diffusion_alpha_init: 0.1
  temporal_context_diffusion_gate_bias: -2.0
  temporal_token_diffusion_alpha_init: 0.05
  temporal_token_diffusion_gate_bias: -3.0

DATA:
  input_channel: 4
  root: dataset/EV-UAV-dataset
  whole_t: 8000 #ms
  res: [346,260]

TRAIN:
  epochs: 50
  batch_size: 1
  train_workers: 8
  optim: Adam # Adam or SGD
  lr: 0.001
  k: 3
  t: 5
  max_events_num : 700000
  train_shuffle: True
  use_amp: False
  amp_dtype: bf16
  deterministic: False
  cudnn_benchmark: True
  empty_cache_every_batch: False
  model_save_root: save_model/grid_mamba/evuav_streaming_ts

TEST:
  vis: False
  eval: True
  roc: True  # Very time-consuming, do not open unless necessary
  pd_detT: 50
  correct_thresh: 0.0001
  save: True
  model_path: save_model/grid_mamba/evuav_streaming_ts/best_loss_seed37.pt
