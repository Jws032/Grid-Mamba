STRUCTURE:
  model_name: evissgnet
  width: 12
  block_residual: True
  block_reps: 2
  use_coords: True

GRID_MAMBA:
  input_dim: 3
  embed_dim: 128
  num_classes: 1
  sensor_size: [720, 1280]

  window_size: 400.0
  use_grid_pos_encoding: True
  use_spatial_window_context: True

  tau_t: 50
  spatial_grid_size: 5
  time_bin_size: 10.0
  use_global_density: True
  use_ts_embedding: False
  use_streaming_ts_embedding: False
  ts_stream_norm_min_count: 256
  ts_stream_norm_eps: 0.000001

  use_knn_spatial_encoder: False

  use_sparse_conv_encoder: True
  sparse_conv_voxel_size: [1.0, 1.0, 1.0]
  sparse_conv_kernel_size: [3, 3, 3]
  sparse_conv_dilations: [1, 2, 3, 4]
  sparse_conv_spatial_dilations: null
  sparse_conv_time_dilations: null
  sparse_conv_hidden_dim: 128
  sparse_conv_ad_channels: 16
  sparse_conv_se_reduction: 2
  sparse_conv_alpha_init: 0.1
  sparse_conv_dropout: 0.1

  scale_strides:
    - [96.0, 80.0, 100.0]
    - [192.0, 160.0, 200.0]
    - [320.0, 240.0, 400.0]

  use_local_mamba: True
  d_state: 16
  d_conv: 4
  expand: 2
  dropout: 0.15
  max_seq_len: 1024
  small_bucket_bs: 128
  mid_bucket_bs: 64
  large_bucket_bs: 16
  use_local_mamba_checkpoint: True
  local_mamba_checkpoint_levels: [0]
  local_mamba_checkpoint_policy: adaptive
  local_mamba_checkpoint_min_window_points: 20000

  spatial_context_stride: 16.0
  spatial_context_use_conv: True
  spatial_context_d_state: 16
  spatial_context_d_conv: 4
  spatial_context_expand: 1
  spatial_context_dropout: 0.15
  spatial_context_alpha_init: 0.1
  spatial_pool_use_score: True
  use_stream_mamba_checkpoint: False
  use_temporal_cell_diffusion: True
  temporal_cell_diffusion_kernel_size: 3
  temporal_cell_diffusion_source: prev_context
  temporal_context_diffusion_alpha_init: 0.1
  temporal_context_diffusion_gate_bias: -2.0
  temporal_token_diffusion_alpha_init: 0.05
  temporal_token_diffusion_gate_bias: -3.0

DATA:
  input_channel: 4
  root: dataset/Ev-Flying-processed
  dataset_name: ev_flying
  whole_t: 8000
  res: [1280, 720]

TRAIN:
  epochs: 50
  batch_size: 1
  train_workers: 8
  optim: Adam
  lr: 0.0001
  weight_decay: 0.0
  scheduler_t_max: 100
  scheduler_eta_min: 0.000001
  loss_pos_weight: null
  k: 3
  t: 5
  max_events_num: 700000
  downsample_seed: 37
  train_shuffle: True
  use_amp: True
  amp_dtype: bf16
  deterministic: False
  cudnn_benchmark: True
  empty_cache_every_batch: False
  early_stopping: False
  model_save_root: save_model/grid_mamba/ev_flying

TEST:
  vis: False
  eval: True
  roc: False
  pd_detT: 50
  correct_thresh: 0.0001
  save: True
  model_path: save_model/grid_mamba/ev_flying/best_iou_seed37.pt
