STRUCTURE:
  model_name: evissgnet
  width: 12
  block_residual: true
  block_reps: 2
  use_coords: true
GRID_MAMBA:
  input_dim: 3
  embed_dim: 128
  num_classes: 1
  sensor_size:
  - 260
  - 346
  use_window: true
  window_size: 400.0
  use_grid_pos_encoding: true
  use_spatial_window_context: true
  tau_t: 50
  spatial_grid_size: 5
  time_bin_size: 10.0
  use_global_density: true
  scale_strides:
  - - 32.0
    - 32.0
    - 100.0
  - - 64.0
    - 64.0
    - 200.0
  - - 128.0
    - 128.0
    - 400.0
  d_state: 16
  d_conv: 4
  expand: 2
  dropout: 0.1
  max_seq_len: 1024
  small_bucket_bs: 128
  mid_bucket_bs: 64
  large_bucket_bs: 16
  use_local_mamba_checkpoint: true
  local_mamba_checkpoint_levels:
  - 0
  local_mamba_checkpoint_policy: adaptive
  local_mamba_checkpoint_min_window_points: 20000
  spatial_context_stride: 8.0
  spatial_context_use_conv: true
  spatial_context_d_state: 16
  spatial_context_d_conv: 4
  spatial_context_expand: 1
  spatial_context_dropout: 0.1
  spatial_context_alpha_init: 0.1
  spatial_pool_use_score: true
  use_stream_mamba_checkpoint: false
  use_temporal_cell_diffusion: false
  temporal_cell_diffusion_kernel_size: 3
  temporal_cell_diffusion_source: dual
  temporal_context_diffusion_alpha_init: 0.1
  temporal_context_diffusion_gate_bias: -2.0
  temporal_token_diffusion_alpha_init: 0.05
  temporal_token_diffusion_gate_bias: -3.0
DATA:
  input_channel: 4
  root: dataset/EV-UAV-dataset
  whole_t: 8000
  res:
  - 346
  - 260
TRAIN:
  epochs: 50
  batch_size: 1
  train_workers: 8
  optim: Adam
  lr: 0.001
  k: 3
  t: 5
  max_events_num: 700000
  use_amp: false
  amp_dtype: bf16
  deterministic: false
  cudnn_benchmark: true
  empty_cache_every_batch: false
  model_save_root: save_model/swc_ablation_a2_no_temporal_diffusion
TEST:
  vis: false
  eval: true
  roc: true
  pd_detT: 50
  correct_thresh: 0.0001
  save: true
  model_path: save_model/swc_ablation_a2_no_temporal_diffusion/best_iou_seed37.pt
  output_path: save_model/swc_ablation_a2_no_temporal_diffusion/predictions.txt
